<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<title>雅思自学打卡</title>
<style>
:root{--blue:#2563eb;--ink:#172033;--muted:#64748b;--bg:#f5f7fb;--card:#fff;--line:#e5e7eb;--green:#16a34a;--orange:#ea580c;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1100px;margin:auto;padding:18px 14px 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand h1{font-size:24px;margin:0}.brand p{color:var(--muted);margin:3px 0 0;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{background:#eef2ff;color:#1e40af;padding:9px 12px;border-radius:10px}.btn.primary{background:var(--blue);color:#fff}.btn.danger{color:#b91c1c;background:#fee2e2}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tab{padding:10px 14px;border-radius:10px;background:#e8edf5;color:#475569;white-space:nowrap}.tab.active{background:var(--blue);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 3px 12px #1e293b08}.metric{font-size:26px;font-weight:750;margin-top:5px}.label{font-size:13px;color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.section-title h2{font-size:17px;margin:0}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:13px;color:#475569}.field input,.field select,.field textarea{border:1px solid #d8dee9;border-radius:9px;padding:9px;background:#fff;color:var(--ink)}textarea{min-height:76px;resize:vertical}.checkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.check{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.check input{accent-color:var(--blue);margin-right:6px}.small{font-size:12px;color:var(--muted)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{font-size:12px;color:var(--muted);font-weight:650}.badge{display:inline-block;padding:3px 7px;border-radius:99px;font-size:12px;background:#eef2ff;color:#1d4ed8}.badge.green{background:#dcfce7;color:#15803d}.badge.orange{background:#ffedd5;color:#c2410c}.empty{padding:28px;text-align:center;color:var(--muted)}.week-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.week-card h3{margin:0 0 8px;font-size:15px}.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);border-radius:99px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:10}.toast.show{display:block}@media(max-width:760px){.app{padding:14px 10px 30px}.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(2,1fr)}.form-grid,.checkgrid{grid-template-columns:1fr 1fr}.week-grid{grid-template-columns:1fr}.brand h1{font-size:21px}.metric{font-size:22px}.actions{width:100%}.actions .btn{flex:1}}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="brand"><h1>雅思自学打卡</h1><p>记录行为，验证进步。数据保存在当前设备。</p></div><div class="actions"><button class="btn" id="exportBtn">导出备份</button><button class="btn" id="importBtn">导入备份</button><input id="fileInput" type="file" accept="application/json" hidden /><button class="btn danger" id="clearBtn">清空数据</button></div></header>
<nav class="tabs"><button class="tab active" data-tab="today">今日打卡</button><button class="tab" data-tab="history">学习记录</button><button class="tab" data-tab="mistakes">错题账本</button><button class="tab" data-tab="review">周复盘</button></nav>
<main id="main"></main><div class="toast" id="toast"></div></div>
<script>
const KEY='ielts-tracker-v1'; const today=()=>new Date().toISOString().slice(0,10); const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{logs:{},mistakes:[]}; let active='today';
const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));render();}; const val=(o,k,d='')=>o&&o[k]!=null?o[k]:d;
function toast(s){const e=document.querySelector('#toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function logFor(d=today()){return state.logs[d]||{date:d,listening:false,listeningMin:0,listeningErr:0,reading:false,readingMin:0,readingRate:'',speaking:false,speakingMin:0,writing:false,writingMin:0,note:''}}
function render(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===active));document.querySelector('#main').innerHTML=views[active]();bind();}
const views={
today(){let l=logFor();return `<section class="grid"><div class="card"><div class="label">连续学习</div><div class="metric">${streak()} 天</div></div><div class="card"><div class="label">累计学习</div><div class="metric">${totalMin()} 分钟</div></div><div class="card"><div class="label">打卡天数</div><div class="metric">${Object.keys(state.logs).length} 天</div></div><div class="card"><div class="label">今日状态</div><div class="metric">${doneCount(l)}/4</div></div></section><div class="card"><div class="section-title"><h2>今天，${l.date}</h2><span class="badge">完成 ${doneCount(l)}/4</span></div><div class="checkgrid"><label class="check"><input type="checkbox" data-k="listening" ${l.listening?'checked':''}/>听力</label><label class="check"><input type="checkbox" data-k="reading" ${l.reading?'checked':''}/>阅读</label><label class="check"><input type="checkbox" data-k="speaking" ${l.speaking?'checked':''}/>口语</label><label class="check"><input type="checkbox" data-k="writing" ${l.writing?'checked':''}/>写作</label></div><div class="form-grid" style="margin-top:14px"><div class="field"><label>听力分钟 / 错题数</label><div style="display:flex;gap:8px"><input type="number" min="0" data-k="listeningMin" value="${l.listeningMin}" placeholder="分钟"/><input type="number" min="0" data-k="listeningErr" value="${l.listeningErr}" placeholder="错题"/></div></div><div class="field"><label>阅读分钟 / 正确率</label><div style="display:flex;gap:8px"><input type="number" min="0" data-k="readingMin" value="${l.readingMin}" placeholder="分钟"/><input type="text" data-k="readingRate" value="${l.readingRate}" placeholder="如 75%"/></div></div><div class="field"><label>口语分钟</label><input type="number" min="0" data-k="speakingMin" value="${l.speakingMin}"/></div><div class="field"><label>写作分钟</label><input type="number" min="0" data-k="writingMin" value="${l.writingMin}"/></div></div><div class="field" style="margin-top:12px"><label>今日最大错误 / 明日只修一个问题</label><textarea data-k="note" placeholder="例：听力 Section 3 连读跟不上；明天精听 10 句">${l.note}</textarea></div><div style="margin-top:14px;display:flex;justify-content:flex-end"><button class="btn primary" id="saveToday">保存今日记录</button></div></div>`},
history(){let rows=Object.values(state.logs).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="card"><div class="section-title"><h2>学习记录</h2><span class="small">共 ${rows.length} 天</span></div>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>日期</th><th>完成</th><th>总分钟</th><th>听力错题</th><th>阅读正确率</th><th>备注</th></tr></thead><tbody>${rows.map(l=>`<tr><td>${l.date}</td><td>${doneCount(l)}/4</td><td>${sumMin(l)}</td><td>${l.listeningErr||0}</td><td>${l.readingRate||'-'}</td><td>${l.note||'-'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">还没有记录。先完成今天的第一次打卡吧。</div>'}</div>`},
mistakes(){return `<div class="card"><div class="section-title"><h2>新增错题</h2><span class="small">每道错题都写清“为什么错”</span></div><div class="form-grid"><div class="field"><label>日期</label><input id="mDate" type="date" value="${today()}"/></div><div class="field"><label>科目</label><select id="mSubject"><option>听力</option><option>阅读</option><option>口语</option><option>写作</option></select></div><div class="field"><label>材料 / 题号</label><input id="mSource" placeholder="Cambridge 18 Test 2 Q14"/></div><div class="field"><label>错因分类</label><select id="mReason"><option>词汇</option><option>声音/连读</option><option>定位错误</option><option>逻辑理解</option><option>语法</option><option>表达不清</option><option>粗心</option><option>其他</option></select></div><div class="field"><label>我的答案</label><input id="mMine"/></div><div class="field"><label>正确答案</label><input id="mRight"/></div></div><div class="field" style="margin-top:12px"><label>我真正没搞清楚什么</label><textarea id="mInsight"></textarea></div><div class="field" style="margin-top:12px"><label>下次验证方式</label><textarea id="mTest" placeholder="明天重听原句并跟读 3 遍"></textarea></div><div style="margin-top:12px;text-align:right"><button class="btn primary" id="addMistake">加入错题账本</button></div></div><div class="card" style="margin-top:16px"><div class="section-title"><h2>历史错题</h2><span class="small">${state.mistakes.length} 条</span></div>${state.mistakes.length?`<div class="table-wrap"><table class="table"><thead><tr><th>日期</th><th>科目</th><th>材料</th><th>错因</th><th>真正没搞清楚</th><th></th></tr></thead><tbody>${state.mistakes.slice().reverse().map(m=>`<tr><td>${m.date}</td><td>${m.subject}</td><td>${m.source||'-'}</td><td><span class="badge orange">${m.reason}</span></td><td>${m.insight||'-'}<div class="small">验证：${m.test||'-'}</div></td><td><button class="btn" data-del="${m.id}">删除</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">还没有错题。遇到错题就记录，不要让它第二次骗你。</div>'}</div>`},
review(){let weeks=[];for(let i=0;i<12;i++){let end=new Date();end.setDate(end.getDate()-i*7);let start=new Date(end);start.setDate(start.getDate()-6);let ds=[];for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1))ds.push(new Date(d).toISOString().slice(0,10));let ls=ds.map(d=>state.logs[d]).filter(Boolean);let mins=ls.reduce((s,l)=>s+sumMin(l),0),days=ls.length,err=ls.reduce((s,l)=>s+(+l.listeningErr||0),0);weeks.push({start:ds[0],end:ds[6],mins,days,err})}return `<div class="week-grid">${weeks.map((w,i)=>`<div class="card week-card"><h3>${i===0?'本周':'第 '+(i+1)+' 周'} <span class="small">${w.start} 至 ${w.end}</span></h3><div style="display:flex;justify-content:space-between"><span>${w.days}/7 天</span><b>${w.mins} 分钟</b></div><div class="progress" style="margin:8px 0 10px"><i style="width:${Math.min(100,w.days/7*100)}%"></i></div><div class="small">听力错题 ${w.err} 道</div></div>`).join('')}</div>`}
};
function doneCount(l){return ['listening','reading','speaking','writing'].filter(k=>l[k]).length}function sumMin(l){return (+l.listeningMin||0)+(+l.readingMin||0)+(+l.speakingMin||0)+(+l.writingMin||0)}function totalMin(){return Object.values(state.logs).reduce((s,l)=>s+sumMin(l),0)}function streak(){let n=0,d=new Date();while(true){let k=d.toISOString().slice(0,10),l=state.logs[k];if(!l||doneCount(l)===0)break;n++;d.setDate(d.getDate()-1)}return n}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()});document.querySelector('#saveToday')?.addEventListener('click',()=>{let l=logFor();document.querySelectorAll('[data-k]').forEach(e=>{let k=e.dataset.k;l[k]=e.type==='checkbox'?e.checked:e.type==='number'?Number(e.value)||0:e.value});state.logs[l.date]=l;save();toast('今日记录已保存')});document.querySelector('#addMistake')?.addEventListener('click',()=>{state.mistakes.push({id:uid(),date:document.querySelector('#mDate').value,subject:document.querySelector('#mSubject').value,source:document.querySelector('#mSource').value,reason:document.querySelector('#mReason').value,mine:document.querySelector('#mMine').value,right:document.querySelector('#mRight').value,insight:document.querySelector('#mInsight').value,test:document.querySelector('#mTest').value});save();toast('已加入错题账本')});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{state.mistakes=state.mistakes.filter(x=>x.id!==b.dataset.del);save()})}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()});document.querySelector('#exportBtn').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='雅思打卡备份.json';a.click();toast('备份已导出')};document.querySelector('#importBtn').onclick=()=>document.querySelector('#fileInput').click();document.querySelector('#fileInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();toast('备份已导入')}catch{toast('文件格式不正确')}};r.readAsText(f)};document.querySelector('#clearBtn').onclick=()=>{if(confirm('确定清空所有本机记录吗？建议先导出备份。')){state={logs:{},mistakes:[]};save();toast('已清空')}};render();
</script></body></html>
